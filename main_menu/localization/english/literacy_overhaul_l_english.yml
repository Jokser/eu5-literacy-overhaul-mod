l_english:
 lo_western_literacy_age2: "Parish Learning"
 lo_western_literacy_age2_desc: "Cathedral and parish schools spread beyond the clergy: town militias learn their letters and a few village children are taught to read the catechism."
 lo_western_literacy_age4: "Schools of the Word"
 lo_western_literacy_age4_desc: "Printed catechisms, grammar schools and the Reformation's demand that every believer read Scripture bring reading to townsfolk, soldiers and even the countryside."
 lo_colonial_literacy_age4: "Colonial Letters"
 lo_colonial_literacy_age4_desc: "Presses, parish schools and missions follow the flag overseas, and the clerks of colonial administration must read and write."
 lo_east_asian_literacy_age4: "Examination and Print"
 lo_east_asian_literacy_age4_desc: "A long tradition of state examinations and a flourishing commercial publishing trade make literacy a mark of the gentry and the merchant alike."
 lo_university_construction: "University Construction"
 lo_stoglav: "Stoglav Council"
 lo_stoglav_desc: "The Hundred Chapters council of 1551 confessed that many of our priests can barely read the service they sing, and ordered schools for clergy candidates in every town. A literate parish clergy slowly takes shape."
 lo_university_maintenance: "University Maintenance"
