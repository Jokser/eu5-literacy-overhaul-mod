l_english:
 lo_western_literacy_age2: "Parish Learning"
 lo_western_literacy_age2_desc: "Cathedral and parish schools spread beyond the clergy: town militias learn their letters and a few village children are taught to read the catechism."
 lo_western_literacy_age4: "Schools of the Word"
 lo_western_literacy_age4_desc: "Printed catechisms, grammar schools and the Reformation's demand that every believer read Scripture bring reading to townsfolk, soldiers and even the countryside."
 lo_colonial_literacy_age4: "Colonial Letters"
 lo_colonial_literacy_age4_desc: "Presses, parish schools and missions follow the flag overseas, and the clerks of colonial administration must read and write."
 lo_east_asian_literacy_age4: "Examination and Print"
 lo_east_asian_literacy_age4_desc: "A long tradition of state examinations and a flourishing commercial publishing trade make literacy a mark of the gentry and the merchant alike."
 lo_university_construction: "University Construction"
 lo_stoglav: "Stoglav Council"
 lo_stoglav_desc: "The Hundred Chapters council of 1551 confessed that many of our priests can barely read the service they sing, and ordered schools for clergy candidates in every town. A literate parish clergy slowly takes shape."
 lo_byzantine_paideia: "Byzantine Paideia"
 lo_byzantine_paideia_desc: "Our archontes learn grammar and rhetoric from private teachers and the schools of the City, and write their letters in the Attic Greek of the ancients. Learning is the mark of a Roman gentleman."
 lo_printed_primers: "Printed Primers"
 lo_printed_primers_desc: "Cheap primers, catechisms, almanacs and chapbooks pour from the presses. Townsfolk and even villagers can now own a book and learn their letters from it."
 lo_church_reading_examinations: "Church Reading Examinations"
 lo_church_reading_examinations_desc: "Every household is examined each year by its pastor in reading and the catechism, and no one may marry or take communion without being able to read. Reading becomes the mark of every Christian."
 lo_university_maintenance: "University Maintenance"
 lo_armenian_scriptoria: "Scriptoria of the Vardapets"
 lo_armenian_scriptoria_desc: "Since Mesrop Mashtots gave us our letters, our monasteries have copied and illuminated books without end, and the vardapets of Gladzor and Tatev teach theology, grammar and philosophy. Even our merchants keep their letters and ledgers in our own script."
 lo_armenian_printing: "Armenian Printing"
 lo_armenian_printing_desc: "Hakob Meghapart printed the first Armenian books in Venice in 1512, and the presses of our diaspora soon carry psalters, calendars and merchants' manuals to every Armenian community."
 STATIC_MODIFIER_NAME_lo_learned_elite: "Learned Elite"
 STATIC_MODIFIER_DESC_lo_learned_elite: "The education of our nobles, clergy and burghers drives our research, however few they are."
